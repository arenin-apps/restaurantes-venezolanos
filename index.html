<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurantes Venezolanos en el Reino Unido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #170a0d;
    --bg-alt: #1f0f13;
    --card: #241116;
    --card-hover: #2c1419;
    --line: rgba(255,231,226,0.09);
    --bordo: #7d1935;
    --bordo-bright: #a52444;
    --ember: #d98a4f;
    --ember-soft: rgba(217,138,79,0.14);
    --text: #faf1ef;
    --text-muted: #d8b8b3;
    --text-faint: #b3919a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .grill-texture {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.05;
    background-image: repeating-linear-gradient(
      -35deg,
      var(--ember) 0px,
      var(--ember) 2px,
      transparent 2px,
      transparent 34px
    );
    z-index: 0;
  }

  header {
    position: relative;
    padding: 56px 24px 40px;
    text-align: center;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(125,25,53,0.35), transparent 70%),
      var(--bg-alt);
    border-bottom: 1px solid var(--line);
    overflow: hidden;
  }

  h1 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    font-size: clamp(2rem, 5vw, 3.1rem);
    margin: 0 0 12px;
    letter-spacing: -0.02em;
  }

  header p.sub {
    color: var(--text-muted);
    font-size: 15px;
    max-width: 480px;
    margin: 0 auto;
    line-height: 1.5;
  }

  main {
    max-width: 920px;
    margin: 0 auto;
    padding: 0 20px 80px;
    position: relative;
    z-index: 1;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: -22px 0 28px;
    padding: 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 12px 30px -14px rgba(0,0,0,0.6);
  }

  .controls input[type="text"],
  .controls select {
    background: var(--bg-alt);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 9px;
    padding: 11px 14px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }

  .controls input[type="text"] {
    flex: 1 1 220px;
  }

  .controls input[type="text"]::placeholder { color: var(--text-faint); }

  .controls select {
    flex: 1 1 150px;
    color-scheme: dark;
  }

  .controls input[type="text"]:focus,
  .controls select:focus {
    border-color: var(--ember);
  }

  .controls button.reset {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-muted);
    border-radius: 9px;
    padding: 11px 16px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  .controls button.reset:hover { border-color: var(--ember); color: var(--ember); }

  .controls button.nearest {
    background: var(--ember);
    border: 1px solid var(--ember);
    color: var(--bg);
    border-radius: 9px;
    padding: 11px 16px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  .controls button.nearest:hover { background: var(--ember-soft-hover, #e8a565); }
  .controls button.nearest:disabled {
    opacity: 0.5;
    cursor: default;
  }
  .controls button.nearest.active {
    background: var(--bg-alt);
    color: var(--ember);
    border-color: var(--ember);
  }

  .nearest-status {
    margin: -18px 0 22px;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    background: var(--ember-soft);
    color: var(--ember);
    border: 1px solid rgba(217,138,79,0.3);
  }
  .nearest-status.error {
    background: rgba(220,80,80,0.1);
    color: #e08080;
    border-color: rgba(220,80,80,0.3);
  }

  .distance-badge {
    font-size: 11px;
    font-weight: 700;
    color: var(--ember);
    background: var(--ember-soft);
    border-radius: 999px;
    padding: 4px 10px;
    white-space: nowrap;
  }

  .count-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--text-faint);
    font-size: 13px;
    margin-bottom: 14px;
    padding: 0 2px;
  }

  .count-row a {
    color: var(--ember);
    text-decoration: none;
    font-weight: 600;
  }
  .count-row a:hover { text-decoration: underline; }

  .list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px 22px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .card:hover { border-color: rgba(217,138,79,0.35); background: var(--card-hover); }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px 16px;
    margin-bottom: 10px;
  }

  .card h3 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    font-size: 19px;
    margin: 0;
    letter-spacing: -0.01em;
    color: var(--text);
  }

  .tag-location {
    font-size: 11px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--ember);
    background: var(--ember-soft);
    border-radius: 999px;
    padding: 4px 10px;
    white-space: nowrap;
    font-weight: 600;
  }

  .card-row {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    font-size: 13.5px;
    color: var(--text-muted);
    margin-top: 7px;
    line-height: 1.45;
  }

  .card-row .icon {
    flex-shrink: 0;
    width: 15px;
    text-align: center;
    color: var(--text-faint);
    margin-top: 1px;
  }

  .card-row a {
    color: var(--text-muted);
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  .card-row a:hover {
    color: var(--ember);
    border-bottom-color: var(--ember);
  }

  .socials {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }

  .social-chip {
    font-size: 12px;
    color: var(--text);
    background: var(--bg-alt);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 12px;
    text-decoration: none;
  }
  .social-chip:hover { border-color: var(--ember); color: var(--ember); }

  .empty {
    text-align: center;
    padding: 70px 20px;
    color: var(--text-faint);
  }
  .empty .big { font-size: 34px; margin-bottom: 10px; }
  .empty p { margin: 4px 0; }

  footer {
    text-align: center;
    padding: 30px 20px 50px;
    color: var(--text-faint);
    font-size: 12.5px;
    position: relative;
    z-index: 1;
  }
  footer a { color: var(--ember); text-decoration: none; }

  @media (max-width: 520px) {
    header { padding: 42px 18px 36px; }
    .controls { margin-top: -16px; }
    .card-top { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<div class="grill-texture"></div>

<header>
  <h1>Restaurantes Venezolanos</h1>
  <p class="sub">Arepas, cachapas, tequeños y sabores de casa,<br>de punta a punta del Reino Unido.</p>
</header>

<main>
  <div class="controls">
    <input type="text" id="search" placeholder="Buscar por nombre, ciudad o dirección…">
    <select id="pais">
      <option value="">Todos los países</option>
    </select>
    <select id="county">
      <option value="">Todos los condados</option>
    </select>
    <button class="nearest" id="nearest">📍 El más cercano</button>
    <button class="reset" id="reset">Limpiar filtros</button>
  </div>

  <div class="nearest-status" id="nearest-status" style="display:none;"></div>

  <div class="count-row">
    <span id="count">Cargando…</span>
    <a href="https://venenin.uk/sugerir-un-restaurante/" target="_blank" rel="noopener">+ Sugerir un restaurante</a>
  </div>

  <div class="list" id="list"></div>

  <div class="empty" id="empty" style="display:none;">
    <div class="big">🍖</div>
    <p>No encontramos restaurantes con esos filtros.</p>
    <p>Probá con otra búsqueda o limpiá los filtros.</p>
  </div>
</main>

<footer>
  Catálogo comunitario de <a href="https://venenin.uk" target="_blank" rel="noopener">VENenIN — VENezolanos en INglaterra</a>
</footer>

<script>
  const state = { data: [], search: '', pais: '', county: '', nearestMode: false, userCoords: null };

  const $search = document.getElementById('search');
  const $pais = document.getElementById('pais');
  const $county = document.getElementById('county');
  const $reset = document.getElementById('reset');
  const $nearest = document.getElementById('nearest');
  const $nearestStatus = document.getElementById('nearest-status');
  const $list = document.getElementById('list');
  const $empty = document.getElementById('empty');
  const $count = document.getElementById('count');

  // Distancia entre dos puntos geográficos en km (fórmula de Haversine).
  function distanceKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a =
      Math.sin(dLat / 2) ** 2 +
      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
      Math.sin(dLon / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function formatDistance(km) {
    return km < 1 ? `${Math.round(km * 1000)} m` : `${km.toFixed(1)} km`;
  }

  function showNearestStatus(message, isError, showFallbackLink) {
    $nearestStatus.innerHTML = message
      ? message + (showFallbackLink ? ' <a href="https://arenin-apps.github.io/restaurantes-venezolanos/" target="_blank" rel="noopener" style="color:inherit; text-decoration:underline;">Abrir en una pestaña nueva</a>' : '')
      : '';
    $nearestStatus.className = 'nearest-status' + (isError ? ' error' : '');
    $nearestStatus.style.display = message ? 'block' : 'none';
  }

  function exitNearestMode() {
    state.nearestMode = false;
    state.userCoords = null;
    $nearest.classList.remove('active');
    $nearest.textContent = '📍 El más cercano';
    showNearestStatus('');
    render();
  }

  function enterNearestMode() {
    if (!navigator.geolocation) {
      showNearestStatus('Tu navegador no admite geolocalización.', true);
      return;
    }
    $nearest.disabled = true;
    $nearest.textContent = 'Buscando tu ubicación…';
    showNearestStatus('');

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        state.userCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        state.nearestMode = true;
        state.search = '';
        state.pais = '';
        state.county = '';
        $search.value = '';
        $pais.value = '';
        $county.value = '';
        $nearest.disabled = false;
        $nearest.textContent = '✕ Ver todos';
        $nearest.classList.add('active');
        render();
      },
      (err) => {
        $nearest.disabled = false;
        $nearest.textContent = '📍 El más cercano';
        let msg = 'No pudimos obtener tu ubicación.';
        let showFallback = false;
        if (err.code === err.PERMISSION_DENIED) {
          msg = 'Este navegador no permite compartir tu ubicación dentro de esta página embebida.';
          showFallback = true;
        } else if (err.code === err.TIMEOUT) {
          msg = 'La búsqueda de ubicación tardó demasiado. Probá de nuevo.';
        }
        showNearestStatus(msg, true, showFallback);
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 300000 }
    );
  }

  $nearest.addEventListener('click', () => {
    if (state.nearestMode) {
      exitNearestMode();
    } else {
      enterNearestMode();
    }
  });

  function normalize(str) {
    return (str || '').toString().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function socialUrl(plataforma, handle) {
    if (!plataforma || !handle) return null;
    const p = plataforma.toLowerCase();
    let h = handle.trim();
    if (h.startsWith('@')) h = h.slice(1);
    if (h.startsWith('/')) h = h.slice(1);
    if (p.includes('instagram')) return 'https://instagram.com/' + h;
    if (p.includes('facebook')) return 'https://facebook.com/' + h;
    if (p.includes('tiktok')) return 'https://tiktok.com/@' + h;
    if (p.includes('twitter') || p === 'x') return 'https://x.com/' + h;
    return null;
  }

  function iconFor(platform) {
    if (!platform) return '';
    const p = platform.toLowerCase();
    if (p.includes('instagram')) return 'IG';
    if (p.includes('facebook')) return 'FB';
    if (p.includes('tiktok')) return 'TT';
    if (p.includes('twitter') || p === 'x') return 'X';
    return platform.slice(0,2).toUpperCase();
  }

  function renderCard(r, distanceLabel) {
    const loc = [r.county, r.pais].filter(Boolean).join(', ');
    let html = `<div class="card">
      <div class="card-top">
        <h3>${r.nombre}</h3>
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          ${distanceLabel ? `<span class="distance-badge">${distanceLabel}</span>` : ''}
          ${loc ? `<span class="tag-location">${loc}</span>` : ''}
        </div>
      </div>`;

    if (r.direccion) {
      html += `<div class="card-row">
        <span class="icon">📍</span>
        <span>${r.mapsUrl ? `<a href="${r.mapsUrl}" target="_blank" rel="noopener">${r.direccion}</a>` : r.direccion}</span>
      </div>`;
    }
    if (r.telefono) {
      html += `<div class="card-row"><span class="icon">📞</span><span style="font-family:'IBM Plex Mono',monospace;"><a href="tel:${r.telefono}">${r.telefono}</a></span></div>`;
    }
    if (r.sitioWeb) {
      html += `<div class="card-row"><span class="icon">🌐</span><span><a href="${r.sitioWeb}" target="_blank" rel="noopener">${r.sitioWeb.replace(/^https?:\/\//, '')}</a></span></div>`;
    }
    if (r.redes && r.redes.length) {
      const redesValidas = r.redes.filter(s => s && s.handle);
      if (redesValidas.length) {
        html += `<div class="socials">`;
        redesValidas.forEach(s => {
          const url = socialUrl(s.plataforma, s.handle);
          html += url
            ? `<a class="social-chip" href="${url}" target="_blank" rel="noopener">${iconFor(s.plataforma)} ${s.handle}</a>`
            : `<span class="social-chip">${iconFor(s.plataforma)} ${s.handle}</span>`;
        });
        html += `</div>`;
      }
    }
    html += `</div>`;
    return html;
  }

  function applyFilters() {
    const q = normalize(state.search);
    return state.data.filter(r => {
      if (state.pais && r.pais !== state.pais) return false;
      if (state.county && r.county !== state.county) return false;
      if (q) {
        const hay = normalize([r.nombre, r.direccion, r.county, r.pais].join(' '));
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  function render() {
    if (state.nearestMode && state.userCoords) {
      const withCoords = state.data.filter(
        (r) => typeof r.latitude === 'number' && typeof r.longitude === 'number'
      );
      const withDistance = withCoords.map((r) => ({
        r,
        km: distanceKm(state.userCoords.lat, state.userCoords.lon, r.latitude, r.longitude)
      }));
      withDistance.sort((a, b) => a.km - b.km);
      const nearest = withDistance.slice(0, 10);

      $count.textContent = nearest.length
        ? `Los ${nearest.length} restaurantes más cercanos a vos`
        : 'No encontramos restaurantes con coordenadas cargadas todavía';

      if (!nearest.length) {
        $list.innerHTML = '';
        $empty.style.display = 'block';
        return;
      }
      $empty.style.display = 'none';
      $list.innerHTML = nearest
        .map(({ r, km }) => renderCard(r, formatDistance(km)))
        .join('');
      return;
    }

    const filtered = applyFilters();
    $count.textContent = filtered.length === 1
      ? '1 restaurante encontrado'
      : `${filtered.length} restaurantes encontrados`;

    if (!filtered.length) {
      $list.innerHTML = '';
      $empty.style.display = 'block';
      return;
    }
    $empty.style.display = 'none';
    $list.innerHTML = filtered
      .slice()
      .sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'))
      .map((r) => renderCard(r))
      .join('');
  }

  function populateCountyOptions() {
    const counties = [...new Set(
      state.data
        .filter(r => !state.pais || r.pais === state.pais)
        .map(r => r.county)
        .filter(Boolean)
    )].sort((a, b) => a.localeCompare(b, 'es'));

    $county.innerHTML = '<option value="">Todos los condados</option>' +
      counties.map(c => `<option value="${c}">${c}</option>`).join('');
  }

  function populatePaisOptions() {
    const paises = [...new Set(state.data.map(r => r.pais).filter(Boolean))]
      .sort((a, b) => a.localeCompare(b, 'es'));
    $pais.innerHTML = '<option value="">Todos los países</option>' +
      paises.map(p => `<option value="${p}">${p}</option>`).join('');
  }

  $search.addEventListener('input', e => {
    if (state.nearestMode) exitNearestMode();
    state.search = e.target.value;
    render();
  });
  $pais.addEventListener('change', e => {
    if (state.nearestMode) exitNearestMode();
    state.pais = e.target.value;
    state.county = '';
    populateCountyOptions();
    render();
  });
  $county.addEventListener('change', e => {
    if (state.nearestMode) exitNearestMode();
    state.county = e.target.value;
    render();
  });
  $reset.addEventListener('click', () => {
    if (state.nearestMode) exitNearestMode();
    state.search = ''; state.pais = ''; state.county = '';
    $search.value = ''; $pais.value = ''; $county.value = '';
    populateCountyOptions();
    render();
  });

  fetch('restaurants.json')
    .then(res => res.json())
    .then(data => {
      state.data = data;
      populatePaisOptions();
      populateCountyOptions();
      render();
    })
    .catch(() => {
      $count.textContent = 'No se pudo cargar el listado.';
    });
</script>

</body>
</html>
